name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated code is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/*/src/gen

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package VSIX
        id: package
        env:
          # On pull requests github.sha is the merge commit; name the artifact after the pushed commit
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pnpm package
          version=$(node -p "require('./application/vscode/package.json').version")
          echo "name=umldiagram-${version}-${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: client/release/vsix/*.vsix
          if-no-files-found: error

      - name: Add VSIX to the summary
        env:
          NAME: ${{ steps.package.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### VSIX"
            echo
            echo "[Download \`${NAME}\`](${URL}) (zip containing the \`.vsix\`)."
            echo
            echo "Install it with \`code --install-extension <file>.vsix\` or via *Extensions → … → Install from VSIX…*."
          } >> "$GITHUB_STEP_SUMMARY"
